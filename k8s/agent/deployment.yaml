apiVersion: apps/v1
kind: Deployment
metadata:
  name: aklp-agent
  namespace: aklp
  labels:
    app: aklp-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aklp-agent
  template:
    metadata:
      labels:
        app: aklp-agent
    spec:
      containers:
        - name: aklp-agent
          image: ghcr.io/next-gen-dist-sys/aklp-agent:latest
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              alembic upgrade head &&
              python -m uvicorn app.main:app --host 0.0.0.0 --port 8001
          ports:
            - containerPort: 8001
              name: http
              protocol: TCP
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: APP_NAME
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DEBUG
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: LOG_FORMAT
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: api-key
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
