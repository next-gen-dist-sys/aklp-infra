apiVersion: apps/v1
kind: Deployment
metadata:
  name: aklp-task
  namespace: aklp
  labels:
    app: aklp-task
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aklp-task
  template:
    metadata:
      labels:
        app: aklp-task
    spec:
      containers:
        - name: aklp-task
          image: ghcr.io/next-gen-dist-sys/aklp-task:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              name: http
              protocol: TCP
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: task-config
                  key: APP_NAME
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: task-config
                  key: DEBUG
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: task-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: task-config
                  key: LOG_FORMAT
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: task-config
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always