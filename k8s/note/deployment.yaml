apiVersion: apps/v1
kind: Deployment
metadata:
  name: aklp-note
  namespace: aklp
  labels:
    app: aklp-note
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aklp-note
  template:
    metadata:
      labels:
        app: aklp-note
    spec:
      containers:
        - name: aklp-note
          image: ghcr.io/next-gen-dist-sys/aklp-note:latest
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              alembic upgrade head &&
              python -m uvicorn app.main:app --host 0.0.0.0 --port 8002
          ports:
            - containerPort: 8002
              name: http
              protocol: TCP
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: note-config
                  key: APP_NAME
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: note-config
                  key: DEBUG
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: note-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: note-config
                  key: LOG_FORMAT
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: note-config
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always